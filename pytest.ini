# Where the tests are -- and, as much as that, where they are not.
#
# `pytest` with no arguments walks the checkout, and a checkout holds more than
# one copy of tests/: the development tree keeps a product's suite beside its
# code (emkit/tests/, plugins/<name>/tests/) and assembles them into
# build/<name>/tests/, and tools/publish.py stages a third copy into the public
# clone. Test files have no package around them, so a second copy of
# test_foo.py is a second module named test_foo, and pytest collects neither --
# it stops with an import file mismatch. Pinning collection to the tests/ next
# to this file is what keeps a bare `pytest` working while those copies exist:
# in an assembled tree that is the whole suite, and in the development tree it
# is the repository's own tests (see tests/conftest.py).
#
# ems/ is the simulator's own tree (its own repo, its own tests); nothing here
# runs it.
[pytest]
testpaths = tests
norecursedirs = *_pub build dist ems .git emkit plugins
