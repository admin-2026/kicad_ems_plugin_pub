# Where the tests are -- and, as much as that, where they are not.
#
# `pytest` with no arguments walks the checkout, and this checkout holds more
# than one copy of tests/: tools/publish.py stages the publishable tree into
# kicad_ems_plugin_pub/, and build/ holds a staged package per OS. Test files have
# no package around them, so a second copy of test_foo.py is a second module
# named test_foo, and pytest collects neither -- it stops with an import file
# mismatch. Pinning collection to the tests/ that belongs to this checkout is
# what keeps a bare `pytest` working while those copies exist.
#
# ems/ is the simulator's own tree (its own repo, its own tests); nothing here
# runs it.
[pytest]
testpaths = tests
norecursedirs = kicad_ems_plugin_pub build dist ems .git
