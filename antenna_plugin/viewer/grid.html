<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FDTD Grid Viewer</title>
<link rel="stylesheet" href="css/theme.css">
<style>
  body{display:flex;height:100vh;overflow:hidden}
  #view3d{flex:1;position:relative;min-width:0}
  /* Same vignette as the report's viewport: the model sits in the page
     rather than on it. Click-through, so the orbit controls never see it. */
  #view3d::after{content:'';position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 140px rgba(0,0,0,.6)}
  #side{width:340px;padding:0 16px 40px;overflow-y:auto;background:var(--rail);
        border-left:1px solid var(--line);scrollbar-width:thin;
        scrollbar-color:var(--line) transparent}
  #side::-webkit-scrollbar{width:9px}
  #side::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;
        border:3px solid var(--rail)}
  #railtop{position:sticky;top:0;z-index:2;background:var(--rail);
           padding:14px 0 9px;border-bottom:1px solid var(--line)}
  #railtop h1{margin:0}
  #axislegend{position:absolute;left:16px;bottom:14px;z-index:1;
    font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}
  #axislegend b{font-weight:500}
  .ax-x{color:var(--ax-x)}
  .ax-y{color:var(--ax-y)}
  .ax-z{color:var(--ax-z)}
  /* The group list is the page's one piece of interface, so it gets the
     hairline treatment: rows separated by rules, not by gaps. */
  #groups{border-top:1px solid var(--line);margin-top:4px}
  #groups .togglerow{margin:0;border-radius:0;padding:7px 6px;
                     border-bottom:1px solid var(--line)}
  /* The functional sections of the group list -- what the layout draws, what
     the run added, what is the simulation rather than the board. A rule and a
     quiet label, like the report column's own group labels: it separates, it
     does not compete with the rows under it. */
  #groups .grpsec{padding:13px 6px 5px;font-size:10px;letter-spacing:.12em;
                  text-transform:uppercase;color:var(--ink-3);
                  border-bottom:1px solid var(--line)}
  #groups .grpsec:first-child{padding-top:7px}
  /* A group that says something about itself: a small round button at the end
     of its row -- "?" for what the group means, "i" for what it is made of --
     opening a box directly under that row rather than in a panel elsewhere,
     because both belong beside the thing they are about. Closed by default,
     so a page nobody asks anything of reads exactly as it did.

     Filled at rest and outlined while open, which is the way round it needs
     to be: shut, the button is the only sign the explanation exists and has
     to be found on a row of muted text; open, its box is right underneath and
     the button has nothing left to announce. */
  .rowbtn{flex:none;width:15px;height:15px;padding:0;border-radius:50%;
       border:1px solid var(--ink-3);background:var(--ink-3);color:var(--rail);
       font:500 10px/1 var(--font-ui);cursor:help;display:grid;
       place-items:center;transition:background .12s ease,
       border-color .12s ease,color .12s ease}
  .rowbtn:hover{background:var(--ink);border-color:var(--ink)}
  .rowbtn[aria-expanded=true]{background:none;border-color:var(--ink-3);
                              color:var(--ink)}
  .rowbox{display:none;padding:1px 8px 11px 27px;font-size:11.5px;
          line-height:1.55;color:var(--ink-3);
          border-bottom:1px solid var(--line)}
  .rowbox.open{display:block}
  .rowbox p{margin:7px 0 0}
  /* A property list in one of those boxes (the shared .kv measurement row,
     a step smaller here -- it sits inside a legend, not in a report panel). */
  .rowbox .kv{font-size:11.5px;padding:4px 0}
  .rowbox .kv b{font-size:11px}
</style>
</head>
<body>
<div id="view3d">
  <div id="axislegend">
    <b class="ax-x">x</b> <b class="ax-y">y</b> <b class="ax-z">z</b>
    &nbsp;&middot;&nbsp; left-drag rotate &middot; wheel-drag pan &middot; scroll zoom
  </div>
</div>
<div id="side">
  <div id="railtop"><h1>FDTD Grid Viewer</h1></div>
  <!-- Several runs in one page (?scan=<manifest>): what the set is, and the
       list that picks the one drawn below. Both stay hidden on a page drawing
       the single dump beside it; js/runs.js fills and shows them. -->
  <div class="info" id="scanline" style="display:none"></div>
  <div id="runswitch" style="display:none">
    <h2>Runs</h2>
    <div id="runlist"></div>
    <div class="rl-hint">click a row &middot; &larr;/&rarr; step</div>
    <div class="rv-detail" id="rundetail"></div>
  </div>
  <div class="metrics" id="summary"></div>
  <div class="info" id="summarymsg"></div>
  <!-- Everything the selected run draws. It goes away as a block when that
       run has nothing to show, so no heading is left standing over a gap. -->
  <div id="panels">
    <h2>Cell groups</h2>
    <div id="groups"></div>
  </div>
  <!-- What the run has to SAY about itself, under everything it drew: a mesh
       that is not the one the config asked for, and whatever is added next.
       js/notices.js fills it; it stays empty on a run with nothing to say. -->
  <div id="notices"></div>
<div class="credit">Generated by <a target="_blank" rel="noopener" href="https://github.com/admin-2026/kicad_ems_plugin_pub">kicad_ems_plugin</a><small>(right click to copy link)</small></div>
</div>
<script src="vendor/three.js"></script>
<script src="js/dump.js"></script>
<script src="js/pagekit.js"></script>
<script src="js/verdicts.js"></script>
<script src="js/runs.js"></script>
<script src="js/board3d.js"></script>
<script src="js/coverage.js"></script>
<script src="js/notices.js"></script>
<script src="js/grid.js"></script>
</body>
</html>
