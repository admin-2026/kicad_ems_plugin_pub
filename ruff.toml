# Lint and format config for the plugin -- one tool (ruff) doing both jobs,
# driven by `make lint` / `make format` (see tools/lint.py for the runner).
#
# It lives at the repo root, not under the plugin package, so an editor or IDE
# opening any file in the checkout picks up the same rules the Makefile uses.
# ruff is not a build or install dependency: install it where you lint
# (`pip install ruff`).

# The simulator tree is a separate repo with its own toolchain (clang-tidy /
# clang-format via ems/make/lint.mk) and its Python scripts answer to it, not
# to this config -- excluding it here keeps `ruff check .` at the root from
# reaching across that line. The rest is generated or vendored code.
# `dist`, `build` and the `*_pub` staging clones are copies of files that are
# linted where they are written, and a checkout may hold several of each.
extend-exclude = [
    "ems",
    "build",
    "dist",
    "examples",
    "binaries",
    "*_pub",
    "vendor",
]

# Black's default, and the width the formatter targets. The tree is currently
# hand-wrapped nearer 79 (p99 = 81 columns), so `make format` on a file will
# rewrap it; that is the one-time cost of adopting a formatter, which is why
# format/changed exists. 88 is the setting that costs the least of it.
line-length = 88
indent-width = 4

# 3.9 is the floor across the KiCad versions the README supports (7.0+ bundle
# 3.9 or newer), and the plugin is written to it -- typing is
# `Optional[x]`, never `x | None`. Saying so stops pyupgrade (UP045)
# and bugbear (B905, `zip(strict=)`) from recommending 3.10-only syntax that
# would import fine on this machine and fail inside pcbnew. tools/ runs under
# the developer's interpreter and may use newer syntax; the stricter of the
# two targets is the safe one to lint the whole tree with.
target-version = "py39"

[lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear (real bug shapes),
# UP pyupgrade -- bounded by target-version above.
select = ["E", "W", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# The suite is assert-driven end to end (bare_package.run_module_tests runs
# plain `assert` statements, no pytest), so `assert False` for an unreachable
# branch is the same tool as every other line in it, not an oversight. The
# tests sit beside the code they cover -- emkit/tests/, plugins/<name>/tests/
# and this repository's own tests/ -- and assembly merges the first two.
"**/tests/*" = ["B011"]

[format]
# Double quotes and spaces are already what the tree uses; naming them keeps
# the formatter from drifting if the defaults ever change.
quote-style = "double"
indent-style = "space"
docstring-code-format = false

# Prose is not source. Recent ruff also formats the ```python blocks inside
# Markdown, and the notes under dev_docs/ and execution_plan/ are written for
# a reader, not a parser: their snippets are excerpts and sketches (`def
# validate(self): ...` in a column, a lone `Param(...)` that is one item of a
# list elsewhere), and the formatter rewraps them into something that no
# longer reads as the point being made. Same reason docstring-code-format is
# off above -- the code the formatter owns is the code that runs.
exclude = ["*.md"]
